# İstanbul — the whole province (Silivri to Şile), clipped to the official
# administrative boundary so neighbouring Kocaeli (Gebze) is excluded.
name: istanbul
bbox: [27.95, 40.72, 29.97, 41.68]   # [min_lon, min_lat, max_lon, max_lat]
boundary: {name: "İstanbul", admin_level: 4}
data_dir: data

zones:
  cell_size_m: 1000

population:
  source: worldpop
  iso3: TUR
  year: 2026

jobs:
  # Workplace proxy from OSM POIs, read from a local .osm.pbf extract
  # (robust, no rate limits); 'osm' queries Overpass instead. The Turkey
  # extract also provides the street network for routing new bus lines.
  source: pbf
  pbf_url: https://download.openstreetmap.fr/extracts/europe/turkey-latest.osm.pbf
  overpass_url: https://overpass.kumi.systems/api/interpreter

roads:
  source: pbf   # route new bus lines on real streets (same .pbf as jobs)

gtfs:
  # İETT buses + Metrobüs (Mart 2026)
  - name: iett
    dir: iett
    mode_overrides: {"34[A-Z]*": brt}     # Metrobüs lines
    urls:
      agency.csv: https://data.ibb.gov.tr/dataset/8540e256-6df5-4719-85bc-e64e91508ede/resource/df13606d-194b-4587-b868-39ecdc5f8769/download/agency.csv
      calendar.csv: https://data.ibb.gov.tr/dataset/8540e256-6df5-4719-85bc-e64e91508ede/resource/6c9623b1-3858-4b37-b936-8ffa78de2a69/download/calendar.csv
      routes.csv: https://data.ibb.gov.tr/dataset/8540e256-6df5-4719-85bc-e64e91508ede/resource/46dbe388-c8c2-45c4-ac72-c06953de56a2/download/routes.csv
      stops.csv: https://data.ibb.gov.tr/dataset/8540e256-6df5-4719-85bc-e64e91508ede/resource/2299bc82-983b-4bdf-8520-5cef8c555e29/download/stops.csv
      trips.csv: https://data.ibb.gov.tr/dataset/8540e256-6df5-4719-85bc-e64e91508ede/resource/7ff49bdd-b0d2-4a6e-9392-b598f77f5070/download/trips.csv
      stop_times.zip: https://data.ibb.gov.tr/dataset/8540e256-6df5-4719-85bc-e64e91508ede/resource/80401c1c-c240-4a32-8f40-ef697100a681/download/stop_times.zip
  # Ferries (Şehir Hatları, İDO, Turyol, Dentur). Rail from this 2024 feed is
  # replaced by the current OSM rail network below (transit_osm).
  - name: rail
    dir: rail
    include_modes: [ferry]
    urls:
      agency.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/42ae499d-ae9c-4906-ac5c-96e0c155e00b/download/agency.csv
      calendar.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/c84ca913-29ac-4f15-87cd-076aef3dccd6/download/calendar.csv
      frequencies.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/a4c86ce6-64da-41e2-9584-5d83b5fb895c/download/frequencies.csv
      routes.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/36b554c7-cae0-4b7e-978f-fc6a43664e88/download/routes.csv
      stop_times.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/ac646b83-3b6f-4ca2-afb4-9071ab44d9af/download/stop_times.csv
      stops.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/d1f7c258-bbc1-406f-9ab2-7a7c1797c673/download/stops.csv
      trips.csv: https://data.ibb.gov.tr/dataset/121a9892-7945-419a-9b89-49f6083926df/resource/dcee1700-e59f-4a5f-8009-f602045a4507/download/trips.csv

# Current rail network (metro, tram, Marmaray, suburban, funicular) from OSM
# route relations: includes lines opened after 2024 (M11 to Halkalı, M3/M4/M5
# extensions, T5, T6 ...). OSM has no timetables: headways are [peak, off-peak]
# minutes per route type, overridden by a relation's `interval` tag if present.
transit_osm:
  train_include: "Marmaray|Banliyö|\\bT6\\b"   # suburban rail only, no YHT / regional trains
  # planned tram, no ref / opening date in OSM; enable once it is in service
  exclude: "Üsküdar-Cevizli|Cevizli-Üsküdar"
  headways:
    subway: [4, 7]
    light_rail: [5, 8]
    monorail: [5, 8]
    tram: [5, 8]
    train: [8, 15]
    funicular: [5, 8]

traffic:
  source: ibb   # İBB hourly traffic density (geohash-6 average speeds)
  urls:
    - https://data.ibb.gov.tr/dataset/3ee6d744-5da2-40c8-9cd6-0e3e41f1928f/resource/d291989c-429d-4e61-9c70-1f76294b96b8/download/traffic_density_202410.csv

ridership:
  source: ibb   # İBB hourly smart-card boardings -> time-of-day demand profile
  urls:
    - https://data.ibb.gov.tr/dataset/a6855ce7-4092-40a5-82b5-34cf3c7e36e3/resource/ea8daee8-62e4-4c42-903f-15b5e372d902/download/hourly_transportation_202410.csv

demand:
  gravity_d0_km: 10.0

mode_choice:
  car_availability: 0.4   # roughly: share of trips made by people with a car at hand

evaluation:
  hours: [8, 18]
  K: 3000
  M: 5
  origins_per_sim: 300
  Z_min: 60
  corridors:
    - {name: "Esenyurt -> Levent", x: [28.675, 41.030], y: [29.011, 41.082]}
    - {name: "Ümraniye -> Kadıköy", x: [29.124, 41.026], y: [29.027, 40.991]}
    - {name: "Pendik -> Ataşehir", x: [29.233, 40.877], y: [29.112, 40.993]}

candidates:
  n_corridors: 40

optimization:
  budget: {extra_buses: 300, metro_km: 40}
  greedy_rounds: 8
  anneal_iters: 60
  eval_origins: 150   # fewer shortest-path trees while searching; final evaluation uses the full sample

# Budget–time frontier (ptopt frontier): budgets relative to today's network
frontier:
  bus_share: 0.20      # up to +20% of today's peak bus fleet
  rail_share: 0.30     # up to +30% of today's rail network length (new lines + extensions)
  target_min: 50       # mean door-to-door time the city aims for
