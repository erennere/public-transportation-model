[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptopt"
version = "0.1.0"
description = "Public transport line and frequency optimisation from open data (OSM, WorldPop, GTFS, traffic)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "pyproj>=3.6",
  "shapely>=2.0",
  "rasterio>=1.3",
  "requests>=2.31",
  "pyyaml>=6.0",
  "osmium>=4.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ptopt = "ptopt.cli:main"

[tool.setuptools.packages.find]
include = ["ptopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
